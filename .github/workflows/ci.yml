name: Testes

on:
  push:
    branches:
      - main
      # a refatoracao estrutural avanca em commits pequenos e frequentes; sem isto
      # o retorno so viria na abertura do PR de cada onda
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Parte da suite instancia nos JavaFX (Site, e adiante Screen e
      # ScreenPosition). Platform.startup exige um display, que o runner nao tem,
      # entao os testes rodam sob um X virtual.
      - name: Instalar o xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Rodar os testes
        run: xvfb-run --auto-servernum mvn --batch-mode test

      - name: Publicar os relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # Mutation testing e caro demais para rodar em cada push: acionamento manual
  # pela aba Actions, ou via `mvn test-compile pitest:mutationCoverage` local.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar o xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Rodar o mutation testing
        run: xvfb-run --auto-servernum mvn --batch-mode test-compile pitest:mutationCoverage

      - name: Publicar o relatorio de mutacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: target/pit-reports/
          if-no-files-found: ignore
